<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Piggies' Fairyland Adventure</title>
<style>
  /* ============================================================
     PIGGIES' FAIRYLAND ADVENTURE  (v8)
     L1 fairyland • L2 motorcycle • L3 staircase • L4 beach •
     L5 CITY: wolves gobble police + city folk, a wolf on a bike,
     then a BIG pink convertible. In the car the big bad wolf
     swoops in by helicopter dropping bricks — keep driving to
     escape! — then crest a dramatic hill to the church party.
     (L4 ponds removed.)
     Controls: ⬅️➡️ move, ⬆️ / click / button = JUMP,
     ice cream = speed boost, wand = zap, pink car = zoom!
     ============================================================ */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffd9ec;
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive, sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #gameCanvas { display: block; width: 100vw; height: 100vh; }

  /* ---------- Overlay screens: big pictures, tiny words ---------- */
  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    background: linear-gradient(180deg, #ffe3f3 0%, #e6d9ff 55%, #d3ecff 100%);
    z-index: 10;
  }
  .screen.seeThrough { background: transparent; pointer-events: none; }
  .screen.seeThrough .bigButton { pointer-events: auto; }

  .screen h1 {
    font-size: clamp(30px, 8vw, 60px);
    color: #b6488f;
    text-shadow: 0 3px 0 #ffffff, 0 6px 12px rgba(182, 72, 143, 0.25);
    margin-bottom: 18px;
  }

  .bigButton {
    font-family: inherit;
    font-size: clamp(24px, 6vw, 38px);
    padding: 20px 50px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    color: #ffffff;
    background: linear-gradient(180deg, #ff8fc8, #f062a8);
    box-shadow: 0 6px 0 #c94b8a, 0 12px 24px rgba(201, 75, 138, 0.35);
    transition: transform 0.1s ease;
  }
  .bigButton:active { transform: translateY(4px); box-shadow: 0 2px 0 #c94b8a; }

  .emojiRow { font-size: clamp(40px, 11vw, 76px); margin-bottom: 14px; letter-spacing: 8px; }
  .hintRow  { font-size: clamp(26px, 7vw, 44px); margin-bottom: 26px; opacity: 0.85; }

  .hidden { display: none !important; }

  /* On-screen JUMP button (touch devices) */
  #jumpBtn {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    width: 96px; height: 96px;
    border-radius: 50%;
    border: none;
    display: none;                 /* shown only while playing on touch */
    align-items: center;
    justify-content: center;
    font-size: 44px;
    color: #fff;
    background: radial-gradient(circle at 35% 30%, #b07bff, #8a4fd6);
    box-shadow: 0 6px 0 #6c3bb0, 0 10px 18px rgba(108,59,176,.4);
    z-index: 9;
  }
  #jumpBtn:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 2px 0 #6c3bb0; }

  /* Music on/off button */
  #muteBtn {
    position: fixed;
    top: 12px; right: 12px;
    width: 52px; height: 52px;
    border-radius: 50%;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #fff;
    background: radial-gradient(circle at 35% 30%, #ff9ecb, #f062a8);
    box-shadow: 0 4px 0 #c94b8a, 0 6px 12px rgba(201,75,138,.35);
    z-index: 11;
  }
  #muteBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c94b8a; }

  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .floaty { animation: floaty 2.4s ease-in-out infinite; display: inline-block; }
  @keyframes popIn { 0% { transform: scale(0); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .popIn { animation: popIn 0.5s ease-out; }
  @media (prefers-reduced-motion: reduce) { .floaty, .popIn { animation: none; } }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- Background music: drop a file named soundtrack.mp3 in the same folder/repo.
     (Loops, starts on the first tap, controlled by the 🔊 button.) -->
<audio id="bgm" loop preload="auto">
  <source src="soundtrack.mp3" type="audio/mpeg">
</audio>
<button id="muteBtn" aria-label="Music on/off">🔊</button>

<!-- Big tappable jump button for phones/tablets -->
<button id="jumpBtn" aria-label="Jump">⬆️</button>

<!-- ============ START SCREEN ============ -->
<div id="startScreen" class="screen">
  <div class="emojiRow"><span class="floaty">🐷</span><span class="floaty" style="animation-delay:.3s">👑</span><span class="floaty" style="animation-delay:.6s">🫖</span></div>
  <div class="hintRow">⬅️ ➡️ &nbsp; ⬆️</div>
  <button id="startButton" class="bigButton">▶ Play! ✨</button>
</div>

<!-- ============ CAUGHT SCREEN ============ -->
<div id="caughtScreen" class="screen hidden">
  <div class="emojiRow popIn"><span class="floaty">🐺</span><span class="floaty" style="animation-delay:.3s">😋</span></div>
  <h1>Oh no!</h1>
  <button id="retryButton" class="bigButton">↻ Try Again 🐷</button>
</div>

<!-- ============ WIN SCREEN (button label changes per level) ============ -->
<div id="winScreen" class="screen seeThrough hidden">
  <button id="playAgainButton" class="bigButton" style="margin-top:55vh">↻ Play Again 🎀</button>
</div>

let W = 0, H = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  canvas.height = H * dpr;

let audioCtx = null;
function playSound(name) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    const sounds = {
      start:    [523, 784, 0.25],
      boost:    [440, 880, 0.22],   // zoom!
      jump:     [392, 740, 0.16],   // boing-up
      pickup:   [659, 1047, 0.2],
      slice:    [880, 1318, 0.15],
      gobble:   [330, 196, 0.35],
      win:      [523, 1047, 0.5],
      kiss:     [784, 988, 0.12],
      polish:   [988, 1175, 0.1],
      sparkle:  [1047, 1568, 0.18],
      teacup:   [880, 740, 0.12],
      firework: [196, 1568, 0.4],
    };
    const [f1, f2, dur] = sounds[name] || [440, 440, 0.1];
    o.frequency.setValueAtTime(f1, t);
    o.frequency.linearRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur);
  } catch (e) { /* no audio? no problem! */ }
}

// ---------- Helpers ----------
function groundY() { return H * GROUND_RATIO; }

// Height of the floor (in px above the base ground line) at a given world x.
// Flat (0) for levels 1-2; a staircase-up / hall / staircase-down for level 3.
function terrainHeight(x) {
  const t = terrain;
  if (!t) return 0;
  if (t.type === 'hill') {
    if (x < t.h0 || x > t.h1) return 0;
    const u = (x - t.h0) / (t.h1 - t.h0);
    return t.top * 0.5 * (1 - Math.cos(u * Math.PI * 2));   // smooth bump
  }
  // staircase (level 3)
  if (x < t.up0) return 0;
  if (x < t.up1) { const w = (t.up1 - t.up0) / t.steps; const i = Math.floor((x - t.up0) / w); return t.top * (i + 1) / t.steps; }
  if (x < t.down0) return t.top;
  if (x < t.down1) { const w = (t.down1 - t.down0) / t.steps; const i = Math.floor((x - t.down0) / w); return t.top * (1 - (i + 1) / t.steps); }
  return 0;
}
const rand = (a, b) => a + Math.random() * (b - a);

function addSparkles(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    sparkles.push({
      x: x + rand(-20, 20), y: y + rand(-20, 20),
      vx: rand(-1, 1), vy: rand(-2.5, -0.5),
      life: rand(0.5, 1.1), color: color || '#fff48f',
    });
  }
}
function addPuff(x, y) {
  for (let i = 0; i < 8; i++) {
    puffs.push({
      x: x + rand(-15, 15), y: y + rand(-15, 15),
      r: rand(14, 26), vx: rand(-1, 1), vy: rand(-1.2, -0.2),
      life: rand(0.6, 1.0),
    });
  }
}
function addEmoji(x, y, char, size) {
  emojiParticles.push({
    x, y, char, size: size || rand(18, 34),
    vx: rand(-0.6, 0.6), vy: rand(-1.6, -0.6),
    life: rand(1.2, 2.2),
  });
}
function addFirework(x, y) {
  const colors = ['#ff8fc8', '#ffd166', '#9bd8ff', '#c5a3ff', '#aef0c0', '#fff48f'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * Math.PI * 2 + rand(-0.1, 0.1);
    const sp = rand(2.2, 4.6);
    fireworks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.9, 1.5), color });
  }
  playSound('firework');
}

// ==================================================================
//  UPDATE
// ==================================================================
function update(dt) {
  time += dt;

  for (const w of wolves) {
    if (w.alive) w.currentBounce = Math.abs(Math.sin(time * w.speed + w.phase)) * 130;
  }

  // particle motion (always)
  for (const s of sparkles) { s.x += s.vx; s.y += s.vy; s.life -= dt; }
  sparkles = sparkles.filter(s => s.life > 0);
  for (const p of puffs) { p.x += p.vx; p.y += p.vy; p.life -= dt * 0.8; }
  puffs = puffs.filter(p => p.life > 0);
  for (const ep of emojiParticles) { ep.x += ep.vx; ep.y += ep.vy; ep.life -= dt; }
  emojiParticles = emojiParticles.filter(ep => ep.life > 0);
  for (const f of fireworks) { f.x += f.vx; f.y += f.vy; f.vy += 0.05; f.life -= dt; }
  fireworks = fireworks.filter(f => f.life > 0);

  if (state === 'win') { updateWin(dt); return; }
  if (state !== 'playing') return;

  // --- Walking (faster while boosted or driving the car) ---
  const lvlWalk = (level === 1) ? 1.4 : 1;            // Level 1 walks at a snappier normal pace
  const eff = PIG_SPEED * lvlWalk * (pig.driving ? 1.9 : (pig.boost > 0 ? BOOST_MULT : 1));
  pig.walking = false;
  if (input.right) { pig.x += eff; pig.facing = 1;  pig.walking = true; }
  if (input.left)  { pig.x -= eff; pig.facing = -1; pig.walking = true; }
  pig.x = Math.max(60, Math.min(worldLength + 200, pig.x));

  // --- Jump physics ---
  if (pig.vy !== 0 || pig.y > 0) {
    pig.y += pig.vy;
    pig.vy -= GRAVITY;
    if (pig.y <= 0) { pig.y = 0; pig.vy = 0; }
  }

  // --- Timers ---
  if (pig.power > 0) {
    pig.power -= dt;
    if (Math.random() < 0.5) addSparkles(pig.x, groundY() - 50 - pig.y, 1, '#ffd1f7');
  }
  if (pig.boost > 0) {
    pig.boost -= dt;
    if (pig.walking && Math.random() < 0.6)
      addSparkles(pig.x - pig.facing * 30, groundY() - 30 - pig.y, 1, '#9bd8ff');
  }
  if (pig.driving && pig.walking && Math.random() < 0.4)
    addSparkles(pig.x - pig.facing * 42, groundY() - 26, 1, '#ff8fc8');

  // --- Camera ---
  camera = Math.max(0, Math.min(pig.x - W * 0.35, worldLength - W + 300));

  // --- Pickups ---
  for (const p of pickups) {
    if (p.taken) continue;
    if (Math.abs(pig.x - p.x) < 48 && pig.y < 90) {
      p.taken = true;
      if (p.type === 'wand') {
        pig.power = 3;                       // 3s sparkle power
        addSparkles(p.x, groundY() - 60, 24, '#ffe680');
        playSound('pickup');
      } else if (p.type === 'car') {
        pig.driving = true;                  // hop in the pink convertible!
        addSparkles(p.x, groundY() - 60, 30, '#ff8fc8');
        playSound('win');
        helicopter.active = true;            // the big bad wolf swoops in!
        helicopter.x = pig.x - 340;
        helicopter.dropT = 1.0;
      } else {
        pig.boost = 3;                       // 3s zoom!
        addSparkles(p.x, groundY() - 60, 16, '#9bd8ff');
        playSound('boost');
      }
    }
  }

  // --- Level 4: money bags, tide pools, baby sister ---
  if (level === 4) {
    for (const c of coins) {
      if (c.taken) continue;
      if (Math.abs(pig.x - c.x) < 46 && pig.y < 95) {
        c.taken = true; money++;
        addSparkles(c.x, groundY() - terrainHeight(c.x) - 58, 16, '#ffe680');
        playSound('pickup');
      }
    }
    for (const pool of pools) {
      if (pig.x > pool.x0 - 8 && pig.x < pool.x1 + 8 && pig.y < WATER_SAFE) {
        if (time - lastSplash > 0.5) {
          addSparkles(pig.x, groundY() - 16, 12, '#9bd8ff');
          addPuff(pig.x, groundY() - 10);
          playSound('boost'); lastSplash = time;
        }
        pig.x = pool.x0 - 16; pig.vy = 0;     // hop back out — you must jump over!
      }
    }
    // baby sister trails Piggies (and is immune to every villain)
    pigTrail.push({ x: pig.x, y: pig.y });
    if (pigTrail.length > 42) pigTrail.shift();
    const bi = Math.max(0, pigTrail.length - 22);
    baby.x = pigTrail[bi].x; baby.y = pigTrail[bi].y;
  }

  // --- Princess friends ---
  for (const pr of princesses) {
    if (!pr.alive || pr.arrived) continue;
    let danger = false;
    for (const w of wolves) {
      if (!w.alive) continue;
      const gap = w.x - pr.x;
      if (gap > -30 && gap < 150 && w.currentBounce < pr.caution) { danger = true; break; }
    }
    if (!danger) pr.x += pr.speed;
    for (const w of wolves) {
      if (!w.alive) continue;
      if (Math.abs(pr.x - w.x) < WOLF_REACH_X && w.currentBounce < WOLF_DANGER_Y) {
        pr.alive = false; w.fed = time;
        addPuff(pr.x, groundY() - 60); playSound('gobble');
      }
    }
    if (pr.x >= worldLength - 60) pr.arrived = true;
  }

  // --- City NPCs (police + folk) — the wolves chase and gobble them ---
  for (const n of npcs) {
    if (!n.alive || n.arrived) continue;
    let danger = false;
    for (const w of wolves) {
      if (!w.alive) continue;
      const gap = w.x - n.x;
      if (gap > -30 && gap < 150 && w.currentBounce < n.caution) { danger = true; break; }
    }
    if (!danger) n.x += n.speed;
    for (const w of wolves) {
      if (!w.alive) continue;
      if (Math.abs(n.x - w.x) < WOLF_REACH_X && w.currentBounce < WOLF_DANGER_Y) {
        n.alive = false; w.fed = time;
        addPuff(n.x, groundY() - 60); playSound('gobble');
      }
    }
    if (n.x >= worldLength - 300) n.arrived = true;
  }

  // --- Bouncing wolves vs Piggies (run under when they're UP) ---
  for (const w of wolves) {
    if (!w.alive) continue;
    const closeX  = Math.abs(pig.x - w.x) < WOLF_REACH_X;
    const wolfLow = w.currentBounce < WOLF_DANGER_Y;
    const pigLow  = pig.y < SAFE_HEIGHT;
    if (closeX && wolfLow && pigLow) {
      if (pig.power > 0 || pig.driving) {
        w.alive = false; addPuff(w.x, groundY() - 80);
        addSparkles(w.x, groundY() - 80, 20, '#c7f0ff'); playSound('slice');
      } else { gobblePig(w); }
    }
  }

  // --- Motorcycle wolves (JUMP over them!) ---
  for (const m of motos) {
    if (!m.alive) continue;
    m.x += m.dir * m.speed;
    if (m.x > m.max) { m.x = m.max; m.dir = -1; }
    if (m.x < m.min) { m.x = m.min; m.dir = 1; }
    m.puff -= dt;
    if (m.puff <= 0) { addPuff(m.x - m.dir * 36, groundY() - 18); m.puff = 0.5; }

    const closeX = Math.abs(pig.x - m.x) < MOTO_REACH_X;
    const pigLow = pig.y < SAFE_HEIGHT;        // safe if Piggies is up in a jump!
    if (closeX && pigLow) {
      if (pig.power > 0 || pig.driving) {
        m.alive = false; addPuff(m.x, groundY() - 50);
        addSparkles(m.x, groundY() - 50, 20, '#c7f0ff'); playSound('slice');
      } else { gobblePig(null, m); }
    }
  }

  // --- Shadow Wolf knights pacing the stairs (JUMP over them, or zap with the wand) ---
  for (const k of knights) {
    if (!k.alive) continue;
    k.x += k.dir * k.speed;
    if (k.x > k.max) { k.x = k.max; k.dir = -1; }
    if (k.x < k.min) { k.x = k.min; k.dir = 1; }
    const closeX = Math.abs(pig.x - k.x) < 46;
    const pigLow = pig.y < SAFE_HEIGHT;
    if (closeX && pigLow) {
      if (pig.power > 0) {
        k.alive = false;
        addPuff(k.x, groundY() - terrainHeight(k.x) - 60);
        addSparkles(k.x, groundY() - terrainHeight(k.x) - 60, 20, '#ffd1f7');
        playSound('slice');
      } else { gobblePig(); }
    }
  }

  // --- Level 5 car chase: the big bad wolf's brick-dropping helicopter ---
  if (level === 5 && pig.driving && helicopter.active) {
    const heliSpeed = PIG_SPEED * 1.9 * 0.83;          // a touch slower than the car
    helicopter.x = Math.min(helicopter.x + heliSpeed, pig.x - 30);  // chases, never gets ahead
    helicopter.dropT -= dt;
    if (helicopter.dropT <= 0 && helicopter.x > pig.x - W * 0.55) {
      bricks.push({ x: helicopter.x, h: 300, vy: 0, landed: 0 });
      helicopter.dropT = 0.7;
    }
  }
  for (const br of bricks) {
    if (br.h > 0) {
      br.vy += 0.6; br.h -= br.vy;
      if (br.h <= 0) { br.h = 0; br.landed = 0.5; addPuff(br.x, groundY() - terrainHeight(br.x) - 6); }
      else if (br.h < 50 && Math.abs(pig.x - br.x) < 42 && pig.y < 40) gobblePig();  // crash!
    } else {
      br.landed -= dt;
    }
  }
  bricks = bricks.filter(b => b.h > 0 || b.landed > 0);

  // --- Win check ---
  if (pig.x >= worldLength - 80) {
    state = 'win'; winTimer = 0; playSound('win');
  }
}

function gobblePig(wolf, moto) {
  if (state !== 'playing') return;
  state = 'caught';
  pig.eaten = true;
  if (wolf) wolf.fed = time;
  if (moto) moto.fed = time;
  addPuff(pig.x, groundY() - 50);
  playSound('gobble');
  setTimeout(() => showScreen(caughtScreen), 1800);
}

// ----- Win cutscene timing (differs per level) -----
function updateWin(dt) {
  winTimer += dt;

  if (level === 1) {
    if (winTimer < 3.5 && Math.random() < 0.12) {
      addEmoji(W / 2 + rand(-130, 130), groundY() - rand(120, 220),
               ['💕', '💋', '💖', '✨'][Math.floor(Math.random() * 4)]);
      if (Math.random() < 0.3) playSound('kiss');
    }
    if (winTimer > 8 && Math.random() < dt * 1.6)
      addFirework(rand(W * 0.15, W * 0.85), rand(H * 0.12, H * 0.45));
    if (winTimer > 9.5 && !winOverlayShown) {
      winOverlayShown = true;
      playAgainButton.textContent = 'Level 2 ▶';
      showScreen(winScreen);
    }
  } else if (level === 2) {
    // Level 2: makeover (0-3) → tea party (3-7.5) → castle + fireworks (7.5+)
    if (winTimer > 0.4 && winTimer < 3 && Math.random() < 0.25) {
      addEmoji(W / 2 + rand(-120, 120), H * 0.5 - rand(0, 140), '✨', rand(18, 30));
      if (Math.random() < 0.25) playSound('sparkle');
    }
    if (winTimer > 3 && winTimer < 7.5 && Math.random() < 0.08) {
      addEmoji(W / 2 + rand(-160, 160), groundY() - rand(120, 200),
               ['💕', '🫖', '☕', '✨'][Math.floor(Math.random() * 4)]);
      if (Math.random() < 0.25) playSound('teacup');
    }
    if (winTimer > 7.8 && Math.random() < dt * 1.8)
      addFirework(rand(W * 0.15, W * 0.85), rand(H * 0.1, H * 0.4));
    if (winTimer > 11 && !winOverlayShown) {
      winOverlayShown = true;
      playAgainButton.textContent = 'Level 3 ▶';
      showScreen(winScreen);
    }
  } else if (level === 3) {
    // Level 3: board the jet (0-3.5) → take off (3.5-6) → fly into the clouds (6+)
    if (winTimer < 3.5 && Math.random() < 0.12) {
      addEmoji(W / 2 + rand(-150, 150), groundY() - rand(120, 220),
               ['💕', '✨', '💖'][Math.floor(Math.random() * 3)]);
      if (Math.random() < 0.3) playSound('kiss');
    }
    if (winTimer > 6 && Math.random() < dt * 1.2)
      addFirework(rand(W * 0.2, W * 0.8), rand(H * 0.1, H * 0.4));
    if (winTimer > 10.5 && !winOverlayShown) {
      winOverlayShown = true;
      playAgainButton.textContent = 'Level 4 ▶';
      showScreen(winScreen);
    }
  } else if (level === 4) {
    // Level 4: high five (0-3.6) → fly to New York past the Statue of Liberty (3.6+)
    if (winTimer < 3.6 && Math.random() < 0.12) {
      addEmoji(W / 2 + rand(-150, 150), groundY() - rand(120, 220), ['🙌', '✨', '💕'][Math.floor(Math.random() * 3)]);
      if (Math.random() < 0.3) playSound('kiss');
    }
    if (winTimer > 4.2 && Math.random() < dt * 1.0)
      addFirework(rand(W * 0.2, W * 0.8), rand(H * 0.08, H * 0.35));
    if (winTimer > 10.5 && !winOverlayShown) {
      winOverlayShown = true;
      playAgainButton.textContent = 'Level 5 ▶';
      showScreen(winScreen);
    }
  } else {
    // Level 5: church party — confetti rains down + fireworks
    if (Math.random() < 0.6) addConfetti();
    if (winTimer > 2 && Math.random() < dt * 1.4)
      addFirework(rand(W * 0.2, W * 0.8), rand(H * 0.08, H * 0.4));
    if (winTimer > 9 && !winOverlayShown) {
      winOverlayShown = true;
      playAgainButton.textContent = '↻ Play Again 🎀';
      showScreen(winScreen);
    }
  }
}

// ==================================================================
//  DRAWING — backgrounds & world
// ==================================================================
const sx = (x) => x - camera;

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#cfe9ff'); g.addColorStop(0.45, '#eaddff'); g.addColorStop(1, '#ffd9ec');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const sunX = W - 110, sunY = 95;
  ctx.fillStyle = '#fff0a3';
  ctx.beginPath(); ctx.arc(sunX, sunY, 46, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f5b942';
  ctx.beginPath(); ctx.arc(sunX - 14, sunY - 6, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(sunX + 14, sunY - 6, 5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#f5b942'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(sunX, sunY + 8, 16, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
}

function drawCloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.arc(x, y, 26 * s, 0, Math.PI * 2);
  ctx.arc(x + 28 * s, y - 12 * s, 22 * s, 0, Math.PI * 2);
  ctx.arc(x + 56 * s, y, 24 * s, 0, Math.PI * 2);
  ctx.fill();
}
function drawClouds() {
  const drift = time * 8;
  for (let i = 0; i < 7; i++) {
    const cx = ((i * 420 + drift - camera * 0.3) % (W + 500)) - 250;
    drawCloud(cx, 70 + (i % 3) * 55, 0.8 + (i % 3) * 0.25);
  }
}

// An animated fallstreak-hole cloud shaped like the reference photo:
// an irregular wispy loop, brighter hooked tuft at the upper-left, feathery
// lower edge, and faint ice-crystal streaks falling through the middle.
// Position stays put; only the wisps shimmer and sway.
function drawHaloCloud(cx, cy, s, seed) {
  if (cloudReady) {
    // The actual photo — stationary, with only a soft living shimmer/breath/bob
    const baseW = 185 * s;
    const baseH = baseW * (cloudImg.height / cloudImg.width);
    const breathe = 1 + Math.sin(time * 1.1 + seed) * 0.03;
    const bob = Math.sin(time * 0.9 + seed) * 3;
    const w = baseW * breathe, h = baseH * breathe;
    ctx.save();
    ctx.globalAlpha = 0.85 + 0.15 * Math.sin(time * 1.4 + seed);
    ctx.drawImage(cloudImg, cx - w / 2, cy - h / 2 + bob, w, h);
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);

  // Points tracing the loop clockwise from the upper-left hook.
  // r = blob size, a = brightness (heavier/brighter top + left, feathery bottom).
  const pts = [
    { x: -46, y: -58, r: 13, a: 0.95 },
    { x: -30, y: -76, r: 13, a: 1.00 },   // hook tip curling up
    { x: -6,  y: -74, r: 12, a: 0.92 },
    { x: 20,  y: -71, r: 11, a: 0.86 },
    { x: 44,  y: -60, r: 10, a: 0.78 },
    { x: 61,  y: -39, r: 9,  a: 0.68 },
    { x: 70,  y: -11, r: 8,  a: 0.58 },
    { x: 68,  y: 18,  r: 8,  a: 0.52 },
    { x: 57,  y: 43,  r: 8,  a: 0.48 },   // lower-right (feathery, faint)
    { x: 38,  y: 59,  r: 8,  a: 0.44 },
    { x: 10,  y: 65,  r: 8,  a: 0.42 },
    { x: -18, y: 63,  r: 8,  a: 0.44 },
    { x: -43, y: 54,  r: 9,  a: 0.54 },   // lower-left
    { x: -62, y: 30,  r: 10, a: 0.66 },
    { x: -71, y: 1,   r: 11, a: 0.78 },
    { x: -65, y: -28, r: 12, a: 0.88 },
    { x: -55, y: -48, r: 12, a: 0.94 },   // back to the hook
  ];

  // soft feathery band: overlapping radial-gradient blobs
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const wob = Math.sin(time * 1.3 + i * 0.6 + seed) * 2.2;     // gentle shimmer
    const aa = p.a * (0.72 + 0.28 * (0.5 + 0.5 * Math.sin(time * 1.6 + i + seed)));
    const rad = (p.r + wob) * 1.9;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
    g.addColorStop(0, 'rgba(255,255,255,' + aa.toFixed(3) + ')');
    g.addColorStop(0.6, 'rgba(255,255,255,' + (aa * 0.45).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, Math.PI * 2); ctx.fill();
  }

  // brighter hooked tuft accent at the upper-left
  const hookA = 0.85 + 0.15 * Math.sin(time * 1.5 + seed);
  const hg = ctx.createRadialGradient(-38, -66, 0, -38, -66, 30);
  hg.addColorStop(0, 'rgba(255,255,255,' + hookA.toFixed(3) + ')');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.ellipse(-38, -66, 30, 16, -0.5, 0, Math.PI * 2); ctx.fill();

  // faint ice-crystal streaks falling through the hole
  ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const wx = -16 + i * 11;
    const sway = Math.sin(time * 1.4 + i + seed) * 4;
    ctx.globalAlpha = 0.3 + 0.25 * (0.5 + 0.5 * Math.sin(time * 2 + i));
    ctx.beginPath();
    ctx.moveTo(wx, -4);
    ctx.quadraticCurveTo(wx + sway, 16, wx + sway * 1.3, 36);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawCastle(scale, baseXoverride) {
  const baseX = (baseXoverride !== undefined) ? baseXoverride : (350 - camera * 0.45);
  const gy = groundY();
  ctx.save();
  ctx.translate(baseX, 0);
  if (scale) ctx.scale(scale, scale);
  ctx.fillStyle = '#e8d6ff';
  ctx.fillRect(80, gy - 260, 200, 260);
  for (const tx of [40, 280]) {
    ctx.fillStyle = '#dcc6ff'; ctx.fillRect(tx, gy - 320, 60, 320);
    ctx.fillStyle = '#ff9ecb';
    ctx.beginPath(); ctx.moveTo(tx - 12, gy - 320); ctx.lineTo(tx + 30, gy - 400); ctx.lineTo(tx + 72, gy - 320); ctx.fill();
    ctx.strokeStyle = '#a880d8'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(tx + 30, gy - 400); ctx.lineTo(tx + 30, gy - 430); ctx.stroke();
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.moveTo(tx + 30, gy - 430); ctx.lineTo(tx + 60, gy - 422); ctx.lineTo(tx + 30, gy - 414); ctx.fill();
  }
  ctx.fillStyle = '#b685e8';
  ctx.beginPath(); ctx.arc(180, gy - 40, 34, Math.PI, 0); ctx.fill();
  ctx.fillRect(146, gy - 40, 68, 40);
  ctx.fillStyle = '#fff3b0';
  for (const wx of [120, 230]) { ctx.beginPath(); ctx.arc(wx, gy - 180, 13, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}

function drawGround() {
  const gy = groundY();
  if (level === 3) {
    // ----- Stepped stone floor that follows the staircase terrain -----
    ctx.fillStyle = '#e7dcf5';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let p = 0; p <= W; p += 4) ctx.lineTo(p, gy - terrainHeight(p + camera));
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    // step riser shading
    ctx.fillStyle = '#d3c4ea';
    let prevH = terrainHeight(camera);
    for (let p = 4; p <= W; p += 4) {
      const h = terrainHeight(p + camera);
      if (h !== prevH) {
        const yTop = gy - Math.max(h, prevH), yBot = gy - Math.min(h, prevH);
        ctx.fillRect(p - 4, yTop, 4, yBot - yTop);
      }
      prevH = h;
    }
    // surface outline
    ctx.strokeStyle = '#b9a9d4'; ctx.lineWidth = 3; ctx.beginPath();
    for (let p = 0; p <= W; p += 4) { const yy = gy - terrainHeight(p + camera); if (p === 0) ctx.moveTo(p, yy); else ctx.lineTo(p, yy); }
    ctx.stroke();
    // pink carpet runner with gold edges
    ctx.strokeStyle = '#ff6fa8'; ctx.lineWidth = 12; ctx.lineCap = 'butt'; ctx.beginPath();
    for (let p = 0; p <= W; p += 4) { const yy = gy - terrainHeight(p + camera) + 7; if (p === 0) ctx.moveTo(p, yy); else ctx.lineTo(p, yy); }
    ctx.stroke();
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2; ctx.stroke();
    return;
  }
  if (level === 4) {
    // sand following the little hill
    ctx.fillStyle = '#f3e2b3';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let p = 0; p <= W; p += 4) ctx.lineTo(p, gy - terrainHeight(p + camera));
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#e3cf95'; ctx.lineWidth = 4; ctx.beginPath();
    for (let p = 0; p <= W; p += 4) { const yy = gy - terrainHeight(p + camera) + 10; if (p === 0) ctx.moveTo(p, yy); else ctx.lineTo(p, yy); }
    ctx.stroke();
    // tide pools to jump over
    for (const pool of pools) {
      const a = sx(pool.x0), b = sx(pool.x1); if (b < -40 || a > W + 40) continue;
      const cx = (a + b) / 2, rw = (b - a) / 2 + 12, py = gy - 2;
      ctx.fillStyle = '#3fa8cc'; ctx.beginPath(); ctx.ellipse(cx, py, rw, 15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7fd0e6'; ctx.beginPath(); ctx.ellipse(cx, py - 2, rw - 6, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(cx - rw * 0.3, py - 4, 5, 2, 0, 0, Math.PI * 2); ctx.fill();
    }
    // little shells
    for (let wx = 300; wx < worldLength; wx += 520) {
      const x = sx(wx); if (x < -20 || x > W + 20) continue;
      ctx.fillStyle = '#ffd6e8'; ctx.beginPath(); ctx.arc(x, gy + 18, 5, Math.PI, 0); ctx.fill();
    }
    return;
  }
  if (level === 5) {
    // asphalt road following the terrain (flat, then up the hill near the end)
    ctx.fillStyle = '#6e6b78';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let p = 0; p <= W; p += 4) ctx.lineTo(p, gy - terrainHeight(p + camera) + 18);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    // sidewalk strip along the surface
    ctx.strokeStyle = '#cfc6d8'; ctx.lineWidth = 14; ctx.beginPath();
    for (let p = 0; p <= W; p += 4) { const yy = gy - terrainHeight(p + camera) + 9; if (p === 0) ctx.moveTo(p, yy); else ctx.lineTo(p, yy); }
    ctx.stroke();
    ctx.strokeStyle = '#b9b0c8'; ctx.lineWidth = 3; ctx.beginPath();
    for (let p = 0; p <= W; p += 4) { const yy = gy - terrainHeight(p + camera) + 17; if (p === 0) ctx.moveTo(p, yy); else ctx.lineTo(p, yy); }
    ctx.stroke();
    // lane dashes mid-road, following the surface
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 7; ctx.setLineDash([44, 40]); ctx.beginPath();
    for (let p = 0; p <= W; p += 4) { const yy = gy - terrainHeight(p + camera) + (H - gy) * 0.45; if (p === 0) ctx.moveTo(p, yy); else ctx.lineTo(p, yy); }
    ctx.stroke(); ctx.setLineDash([]);
    return;
  }
  ctx.fillStyle = '#c5ecc0'; ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = '#ffe9c9'; ctx.fillRect(0, gy + 18, W, 46);
  ctx.fillStyle = '#ffd9a8';
  for (let i = 0; i < W / 70 + 2; i++) {
    const px = (i * 70 - (camera % 70));
    ctx.beginPath(); ctx.ellipse(px, gy + 41, 22, 10, 0, 0, Math.PI * 2); ctx.fill();
  }
}

// ----- Level 3 building hall backdrop: columns + arched windows -----
function drawHall() {
  if (level !== 3) return;
  const gy = groundY(), t = terrain;
  const wallX0 = sx(t.up0 - 60), wallX1 = sx(t.down1 + 60);
  const wallTop = gy - t.top - 175;
  // back wall
  ctx.fillStyle = 'rgba(232, 223, 250, 0.92)';
  ctx.fillRect(wallX0, wallTop, wallX1 - wallX0, gy - wallTop);
  // roofline
  ctx.fillStyle = '#caa8d8';
  ctx.fillRect(wallX0, wallTop, wallX1 - wallX0, 14);
  // arched windows along the hall
  for (let wx = t.up1 + 110; wx < t.down0; wx += 300) {
    const xx = sx(wx); if (xx < -60 || xx > W + 60) continue;
    ctx.fillStyle = '#cdb9ec';
    ctx.fillRect(xx - 26, gy - t.top - 120, 52, 86);
    ctx.beginPath(); ctx.arc(xx, gy - t.top - 120, 26, Math.PI, 0); ctx.fill();

// ----- Shadow Wolf knight (original cloaked, masked villain with a glowing sword) -----
function drawKnight(k) {
  const x = sx(k.x);
  if (x < -120 || x > W + 120) return;
  const gy = groundY(), floor = terrainHeight(k.x);
  const baseY = gy - floor, bob = Math.sin(time * 4 + k.x) * 4;

  ctx.fillStyle = 'rgba(60,40,80,0.2)';
  ctx.beginPath(); ctx.ellipse(x, baseY + 6, 30, 8, 0, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.translate(x, baseY - bob);
  ctx.scale(k.dir, 1);
  // cloak
  ctx.fillStyle = '#3a2f4a';
  ctx.beginPath(); ctx.moveTo(0, -120); ctx.lineTo(36, -4); ctx.lineTo(-36, -4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2c2338';
  ctx.beginPath(); ctx.ellipse(0, -94, 32, 16, 0, 0, Math.PI * 2); ctx.fill();
  // hood + dark mask
  ctx.fillStyle = '#241c30';
  ctx.beginPath(); ctx.arc(0, -106, 23, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#15101f';
  ctx.beginPath(); ctx.ellipse(0, -102, 14, 17, 0, 0, Math.PI * 2); ctx.fill();

  const glow = 0.55 + Math.sin(time * 6) * 0.4;
  ctx.fillStyle = 'rgba(255,90,150,' + glow + ')';
  ctx.beginPath(); ctx.ellipse(-5, -105, 3, 4, 0, 0, Math.PI * 2); ctx.ellipse(5, -105, 3, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#4a3f5e'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-5, -94); ctx.lineTo(5, -94); ctx.stroke();
  // pointy wolf ears poking from the hood
  ctx.fillStyle = '#241c30';
  ctx.beginPath(); ctx.moveTo(-18, -118); ctx.lineTo(-12, -138); ctx.lineTo(-4, -120); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(18, -118); ctx.lineTo(12, -138); ctx.lineTo(4, -120); ctx.closePath(); ctx.fill();
  // glowing magic sword
  ctx.save(); ctx.translate(32, -72); ctx.rotate(-0.3);
  ctx.strokeStyle = '#5a4a66'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, 4); ctx.stroke();
  const blade = ctx.createLinearGradient(0, 4, 0, -60);
  blade.addColorStop(0, '#ffd1f7'); blade.addColorStop(1, '#ff4f9d');
  ctx.strokeStyle = blade; ctx.lineWidth = 8;
  ctx.shadowColor = '#ff7ac0'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(0, -60); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();
  ctx.restore();
}

function drawBeachBack() {
  const gy = groundY();
  // sea band along the horizon
  const seaTop = gy - 54;
  const sea = ctx.createLinearGradient(0, seaTop, 0, gy);
  sea.addColorStop(0, '#7fd0e6'); sea.addColorStop(1, '#48b3d6');
  ctx.fillStyle = sea; ctx.fillRect(0, seaTop, W, 54);
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 3;
  for (let i = 0; i < 4; i++) {
    const yy = seaTop + 12 + i * 11;

    ctx.beginPath();
    for (let xx = -off; xx < W; xx += 120) ctx.ellipse(xx + 60, yy, 16, 3.5, 0, Math.PI, 0);
    ctx.stroke();

function drawBricks() {
  const gy = groundY();
  for (const br of bricks) {
    const x = sx(br.x); if (x < -40 || x > W + 40) continue;
    const surf = gy - terrainHeight(br.x);
    if (br.h > 0) {
      const t = 1 - Math.min(br.h / 300, 1);                 // landing telegraph
      ctx.fillStyle = 'rgba(60,40,40,' + (0.1 + 0.25 * t) + ')';
      ctx.beginPath(); ctx.ellipse(x, surf - 2, 10 + 16 * t, 4 + 4 * t, 0, 0, Math.PI * 2); ctx.fill();
      drawBrick(x, surf - br.h - 10);
    } else {
      ctx.globalAlpha = Math.max(br.landed / 0.5, 0) * 0.7;
      drawBrick(x, surf - 10);
      ctx.globalAlpha = 1;
    }
  }
}

function drawFlower(x, y, color) {
  ctx.strokeStyle = '#79c267'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 22); ctx.stroke();
  ctx.fillStyle = color;
  for (let i = 0; i < 5; i++) {

  }
  ctx.fillStyle = '#fff3b0';
  ctx.beginPath(); ctx.arc(x, y - 22, 5, 0, Math.PI * 2); ctx.fill();

function drawPig() {

  }
  const gy = groundY();
  const floor = terrainHeight(pig.x);
  const x = sx(pig.x);

  // speed-boost streaks behind her

    ctx.strokeStyle = 'rgba(155,216,255,0.7)'; ctx.lineWidth = 4; ctx.lineCap = 'round';

  ctx.beginPath(); ctx.ellipse(8, -118, 7, 12, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f7a8bf';
  ctx.beginPath(); ctx.ellipse(18, -88, 13, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d97a9c';
  ctx.beginPath(); ctx.arc(14, -88, 2.6, 0, Math.PI * 2); ctx.arc(22, -88, 2.6, 0, Math.PI * 2); ctx.fill();

// ---------- Bouncing wolf ----------
function drawWolf(w) {
  const x = sx(w.x);
  if (x < -180 || x > W + 180) return;
  const gy = groundY();
  const floor = terrainHeight(w.x);
  const bounce = w.currentBounce || 0;
  const y = gy - floor - 12 - bounce;
  const squish = 1 - Math.min(bounce / 400, 0.15);
  const justAte = w.fed > 0;
  const licking = justAte && (time - w.fed < 3.0);
  const bb = justAte ? 18 : 0;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1, squish);

  ctx.fillStyle = '#9b8bb5';
  ctx.beginPath(); ctx.ellipse(0, -55, 42 + bb, 48 + bb * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#cfc3e3';
  ctx.beginPath(); ctx.ellipse(0, -45, 26 + bb, 30 + bb * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  if (justAte) { ctx.strokeStyle = '#9b8bb5'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -40, 5, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke(); }

  ctx.strokeStyle = '#9b8bb5'; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-18, -16); ctx.lineTo(-18, -2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(18, -16);  ctx.lineTo(18, -2);  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  for (const lx of [-18, 18]) {
    ctx.beginPath(); ctx.moveTo(lx - 6, -2); ctx.lineTo(lx - 3, 3); ctx.lineTo(lx, -2); ctx.lineTo(lx + 3, 3); ctx.lineTo(lx + 6, -2); ctx.fill();
  }

  ctx.fillStyle = '#9b8bb5';
  ctx.beginPath(); ctx.arc(0, -118, 30, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-30, -132); ctx.lineTo(-26, -166); ctx.lineTo(-10, -142); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(30, -132); ctx.lineTo(26, -166); ctx.lineTo(10, -142); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#d8b8cc';
  ctx.beginPath(); ctx.moveTo(-26, -138); ctx.lineTo(-24, -156); ctx.lineTo(-15, -142); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(26, -138); ctx.lineTo(24, -156); ctx.lineTo(15, -142); ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#b3a4c9';
  ctx.beginPath(); ctx.ellipse(-26, -110, 20, 12, 0.15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4a3a56';
  ctx.beginPath(); ctx.arc(-42, -112, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-44, -114, 2.4, 0, Math.PI * 2); ctx.fill();

  const lookL = Math.sin(time * 2 + w.phase) * 2;
  ctx.fillStyle = '#fff7d6';
  ctx.beginPath(); ctx.ellipse(-10, -128, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(10, -128, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2e2436';
  ctx.beginPath(); ctx.arc(-7 + lookL, -127, 3.4, 0, Math.PI * 2); ctx.arc(7 - lookL, -127, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#4a3a56'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-19, -142); ctx.lineTo(-3, -136); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(19, -142);  ctx.lineTo(3, -136);  ctx.stroke();

  ctx.fillStyle = '#5e4a70';
  ctx.beginPath(); ctx.ellipse(-8, -102, 14, 9, 0.1, 0, Math.PI * 2); ctx.fill();

  }

  ctx.strokeStyle = '#9b8bb5'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(38 + bb, -60);
  ctx.quadraticCurveTo(58 + bb, -70 + Math.sin(time * 5 + w.phase) * 8, 52 + bb, -90); ctx.stroke();

  if (licking) {
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.roundRect(20, -190, 96, 36, 16); ctx.fill();
    ctx.beginPath(); ctx.moveTo(34, -154); ctx.lineTo(28, -140); ctx.lineTo(50, -154); ctx.fill();
    ctx.fillStyle = '#8a4fb5'; ctx.font = 'bold 17px sans-serif'; ctx.fillText('nom nom!', 32, -166);
  }
  ctx.restore();

  ctx.fillStyle = 'rgba(120, 90, 140, 0.18)';
  ctx.beginPath(); ctx.ellipse(x, gy - floor + 6, (44 + bb) - bounce * 0.1, 9, 0, 0, Math.PI * 2); ctx.fill();
}

// ---------- Motorcycle wolf villain (Level 2) ----------
function drawMoto(m) {
  const x = sx(m.x);
  if (x < -220 || x > W + 220) return;
  const gy = groundY();
  const floor = terrainHeight(m.x);
  ctx.save();
  ctx.translate(x, gy - floor - 18);
  ctx.scale(m.dir, 1);                       // face the way it's going
  ctx.scale(1.35, 1.35);                     // BIGGER bike + rider

  // Wheels
  ctx.fillStyle = '#3a3346';
  for (const wx of [-30, 30]) {
    ctx.beginPath(); ctx.arc(wx, 0, 18, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#7a6f8c'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(wx, 0, 9, 0, Math.PI * 2); ctx.stroke();
    // spinning spoke
    ctx.strokeStyle = '#cfc3e3'; ctx.lineWidth = 3;
    const a = time * 12 * m.dir;
    ctx.beginPath(); ctx.moveTo(wx + Math.cos(a) * 9, Math.sin(a) * 9); ctx.lineTo(wx - Math.cos(a) * 9, -Math.sin(a) * 9); ctx.stroke();
  }

  // Hot-pink bike body
  ctx.fillStyle = '#ff5fa8';
  ctx.beginPath();
  ctx.moveTo(-34, -8); ctx.lineTo(26, -8); ctx.lineTo(34, -22); ctx.lineTo(-6, -22); ctx.closePath(); ctx.fill();
  ctx.fillRect(-12, -30, 22, 12);            // seat hump
  // Handlebars
  ctx.strokeStyle = '#4a3a56'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(30, -20); ctx.lineTo(44, -40); ctx.lineTo(52, -38); ctx.stroke();
  // Exhaust puff at the back
  ctx.fillStyle = 'rgba(200,200,210,0.5)';
  ctx.beginPath(); ctx.arc(-46, -8 + Math.sin(time * 10) * 2, 7, 0, Math.PI * 2); ctx.fill();

  // The goofy wolf rider (BIG now, leaning forward)
  ctx.save();
  ctx.translate(-2, -36);
  ctx.scale(0.82, 0.82);
  // body
  ctx.fillStyle = '#9b8bb5';
  ctx.beginPath(); ctx.ellipse(0, -30, 26, 30, 0, 0, Math.PI * 2); ctx.fill();
  // head
  ctx.fillStyle = '#9b8bb5';
  ctx.beginPath(); ctx.arc(8, -66, 22, 0, Math.PI * 2); ctx.fill();
  // ears
  ctx.beginPath(); ctx.moveTo(-8, -78); ctx.lineTo(-4, -104); ctx.lineTo(8, -86); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(24, -78); ctx.lineTo(22, -104); ctx.lineTo(12, -86); ctx.closePath(); ctx.fill();
  // snout
  ctx.fillStyle = '#b3a4c9';
  ctx.beginPath(); ctx.ellipse(28, -60, 16, 9, 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4a3a56';
  ctx.beginPath(); ctx.arc(42, -60, 5, 0, Math.PI * 2); ctx.fill();
  // racing goggles
  ctx.fillStyle = '#2e2436';
  ctx.beginPath(); ctx.ellipse(4, -70, 8, 6, 0, 0, Math.PI * 2); ctx.ellipse(18, -70, 8, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-4, -74); ctx.lineTo(-14, -76); ctx.stroke();
  ctx.fillStyle = '#9bd8ff';
  ctx.beginPath(); ctx.arc(4, -70, 3, 0, Math.PI * 2); ctx.arc(18, -70, 3, 0, Math.PI * 2); ctx.fill();
  // tongue flapping in the wind
  ctx.fillStyle = '#ff8fb0';
  ctx.beginPath(); ctx.ellipse(40, -52 + Math.sin(time * 12) * 2, 7, 4, 0.2, 0, Math.PI * 2); ctx.fill();
  // little paws on handlebars
  ctx.strokeStyle = '#9b8bb5'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(14, -40); ctx.lineTo(34, -34); ctx.stroke();
  ctx.restore();

  ctx.restore();

  // ground shadow
  ctx.fillStyle = 'rgba(120, 90, 140, 0.18)';
  ctx.beginPath(); ctx.ellipse(x, gy - floor + 8, 68, 11, 0, 0, Math.PI * 2); ctx.fill();
}

// ---------- Pickups ----------
function drawPickups() {
  const gy = groundY();
  for (const p of pickups) {
    if (p.taken) continue;
    const x = sx(p.x);
    if (x < -60 || x > W + 60) continue;
    const bob = Math.sin(time * 3 + p.x) * 8;
    const y = groundY() - terrainHeight(p.x) - 60 + bob;
    if (p.type === 'wand') {
      ctx.fillStyle = 'rgba(255, 240, 150, 0.4)';
      ctx.beginPath(); ctx.arc(x, y, 34 + Math.sin(time * 6) * 4, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.translate(x, y); ctx.rotate(-0.6);
      ctx.strokeStyle = '#c9b6ff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(0, -4); ctx.stroke();
      const grad = ctx.createLinearGradient(0, -4, 0, -28);
      grad.addColorStop(0, '#fff8c4'); grad.addColorStop(1, '#ffe05c');
      ctx.strokeStyle = grad; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(0, -28); ctx.stroke();
      ctx.restore();
      ctx.font = '20px sans-serif'; ctx.fillText('✨', x + 8, y - 24);
    } else {
      // ice cream now glows blue to hint "speed"
      ctx.fillStyle = 'rgba(155,216,255,0.4)';
      ctx.beginPath(); ctx.arc(x, y - 6, 26 + Math.sin(time * 6) * 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f2c178';
      ctx.beginPath(); ctx.moveTo(x - 12, y - 4); ctx.lineTo(x + 12, y - 4); ctx.lineTo(x, y + 26); ctx.fill();
      ctx.fillStyle = '#9bd8ff';
      ctx.beginPath(); ctx.arc(x, y - 12, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d6f0ff';
      ctx.beginPath(); ctx.arc(x - 5, y - 16, 5, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ---------- Particles ----------
function drawParticles() {
  for (const s of sparkles) {
    ctx.globalAlpha = Math.max(s.life, 0);
    ctx.fillStyle = s.color; ctx.font = '14px sans-serif';
    ctx.fillText('✦', sx(s.x), s.y);
  }
  ctx.globalAlpha = 1;
  for (const p of puffs) {
    ctx.globalAlpha = Math.max(p.life * 0.8, 0);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(sx(p.x), p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawScreenParticles() {
  for (const ep of emojiParticles) {
    ctx.globalAlpha = Math.min(ep.life, 1);
    ctx.font = ep.size + 'px sans-serif'; ctx.fillText(ep.char, ep.x, ep.y);
  }
  ctx.globalAlpha = 1;
  for (const f of fireworks) {
    ctx.globalAlpha = Math.min(f.life, 1);
    ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.arc(f.x, f.y, 3.2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------- HUD ----------
function drawHUD() {
  let barY = 24;
  if (pig.power > 0) {
    const w = 200, h = 16, x = W / 2 - w / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.roundRect(x - 4, barY - 4, w + 8, h + 8, 12); ctx.fill();
    const grad = ctx.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, '#ffd166'); grad.addColorStop(1, '#ff8fc8');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(x, barY, w * (pig.power / 3), h, 9); ctx.fill();
    ctx.font = '20px sans-serif'; ctx.fillText('✨', x - 30, barY + 15);
    barY += 30;
  }
  if (pig.boost > 0) {
    const w = 200, h = 16, x = W / 2 - w / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.roundRect(x - 4, barY - 4, w + 8, h + 8, 12); ctx.fill();
    const grad = ctx.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, '#9bd8ff'); grad.addColorStop(1, '#5fc0ff');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(x, barY, w * (pig.boost / 3), h, 9); ctx.fill();
    ctx.font = '20px sans-serif'; ctx.fillText('🍦', x - 30, barY + 15);
  }

  // first-seconds touch hint
  if (isTouch && state === 'playing' && time < 6) {
    ctx.globalAlpha = 0.5 + Math.sin(time * 4) * 0.3;
    ctx.font = 'bold 40px sans-serif';
    ctx.fillText('⬅️', 20, H - 130);
    ctx.fillText('➡️', W - 72, H - 130);
    ctx.globalAlpha = 1;
  }

  // money counter (Level 4)
  if (level === 4) {
    ctx.font = 'bold 24px sans-serif';
    ctx.fillStyle = '#b6488f';
    ctx.fillText('💰 ' + money, 18, 40);
  }
}

// ----- LEVEL 4: high five → fly to New York past the Statue of Liberty -----
function drawHighFivePig(x, y, scale, dress, armDir, slap) {
  drawMiniPig(x, y, scale, dress, false, 0, dress === '#ff7ac0');
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  ctx.strokeStyle = '#f7a8bf'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  const handY = -86 - slap * 8;
  ctx.beginPath(); ctx.moveTo(armDir * 10, -52); ctx.lineTo(armDir * 22, handY); ctx.stroke();
  ctx.fillStyle = '#fbbcd0'; ctx.beginPath(); ctx.arc(armDir * 24, handY, 6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawSkyline(baseY) {
  const heights = [80, 130, 170, 110, 150, 200, 90, 140, 180, 120, 160, 100, 190, 130];
  let x = 0;
  for (let i = 0; i < 60; i++) {
    const w = 30 + (i * 37 % 26), h = heights[i % heights.length];
    ctx.fillStyle = 'rgba(120,130,170,0.7)';
    ctx.fillRect(x, baseY - h, w, h);
    ctx.fillStyle = 'rgba(255,243,176,0.5)';
    for (let wy = baseY - h + 10; wy < baseY - 8; wy += 16)
      for (let wx = x + 5; wx < x + w - 5; wx += 12) ctx.fillRect(wx, wy, 5, 7);
    x += w + 6; if (x > W) break;
  }
}

function drawStatueOfLiberty(x, baseY, s) {
  ctx.save(); ctx.translate(x, baseY); ctx.scale(s, s);
  // pedestal
  ctx.fillStyle = '#bdae8a'; ctx.fillRect(-42, -72, 84, 72);
  ctx.fillStyle = '#a89a76'; ctx.fillRect(-50, -86, 100, 16);
  // robe
  ctx.fillStyle = '#86c9ad';
  ctx.beginPath(); ctx.moveTo(-26, -72); ctx.lineTo(26, -72); ctx.lineTo(16, -180); ctx.lineTo(-16, -180); ctx.closePath(); ctx.fill();
  // left arm + tablet
  ctx.strokeStyle = '#86c9ad'; ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-12, -168); ctx.lineTo(-30, -150); ctx.stroke();
  ctx.fillStyle = '#9ad3ba'; ctx.fillRect(-46, -162, 20, 26);
  // head
  ctx.fillStyle = '#9ad3ba'; ctx.beginPath(); ctx.arc(0, -196, 15, 0, Math.PI * 2); ctx.fill();
  // crown spikes
  ctx.fillStyle = '#86c9ad';
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI * 0.95 + (i / 6) * Math.PI * 0.9;
    const bx = Math.cos(a) * 15, by = -196 + Math.sin(a) * 15;
    const tx = Math.cos(a) * 30, ty = -196 + Math.sin(a) * 30;
    ctx.beginPath(); ctx.moveTo(bx - 3, by); ctx.lineTo(tx, ty); ctx.lineTo(bx + 3, by); ctx.closePath(); ctx.fill();
  }
  // raised arm + torch
  ctx.strokeStyle = '#86c9ad'; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.moveTo(12, -176); ctx.lineTo(30, -232); ctx.stroke();
  ctx.fillStyle = '#caa24a'; ctx.fillRect(26, -244, 10, 16);
  ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.ellipse(31, -250, 8, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.ellipse(31, -252, 4, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawWinLevel4() {
  const gy = groundY();
  if (winTimer < 3.6) {
    // HIGH FIVE on the beach, the jet waiting
    drawSky(); drawClouds(); drawBeachBack();
    ctx.fillStyle = '#f3e2b3'; ctx.fillRect(0, gy, W, H - gy);

    for (let i = 0; i < 5; i++) ctx.fillRect(jx - 150 - i * 14, gy - 8 - i * 14, 18, 14);
    const cx = W * 0.40, slap = Math.abs(Math.sin(time * 5));
    drawHighFivePig(cx - 28, gy - 6, 0.95, '#ff7ac0', +1, slap);   // Piggies
    drawHighFivePig(cx + 28, gy - 4, 0.62, '#9bd8ff', -1, slap);   // baby sister

      ctx.font = '34px sans-serif'; ctx.textAlign = 'center';

    if (Math.random() < 0.12) addEmoji(cx + rand(-90, 90), gy - 120 - rand(0, 60), ['🙌', '✨', '💕'][Math.floor(Math.random() * 3)]);
  } else {
    // FLY TO NEW YORK, over the Statue of Liberty
    const t = winTimer - 3.6;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#ffd9a8'); g.addColorStop(0.5, '#ffc1e0'); g.addColorStop(1, '#bfe3ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff0a3'; ctx.beginPath(); ctx.arc(W * 0.82, 100, 46, 0, Math.PI * 2); ctx.fill();
    // skyline behind the water
    drawSkyline(gy - 30);
    // harbor water
    ctx.fillStyle = '#6cc0db'; ctx.fillRect(0, gy - 30, W, H - (gy - 30));
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3;
    for (let i = 0; i < 6; i++) {
      const yy = gy - 8 + (i % 3) * 16, off = (time * 28 + i * 80) % 140;
      ctx.beginPath(); for (let xx = -off; xx < W; xx += 140) ctx.ellipse(xx + 70, yy, 20, 4, 0, Math.PI, 0); ctx.stroke();
    }
    // Lady Liberty on her island
    drawStatueOfLiberty(W * 0.30, gy - 24, 1.0);
    // the jet flies across, up over the statue
    const px = -220 + t * ((W + 440) / 7);
    const py = H * 0.27 + Math.sin(time * 1.5) * 10;
    drawJet(px, py, 0.9, 0.04);
    if (Math.random() < 0.3) addEmoji(px - 60, py + 20, ['💕', '✨', '🗽'][Math.floor(Math.random() * 3)]);
    ctx.font = '30px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('🗽 ✈️', W / 2, 58 + Math.sin(time * 3) * 6); ctx.textAlign = 'left';
  }
}

// ----- LEVEL 3: board the jet → take off → fly up into the clouds -----
function drawWinLevel3() {
  const gy = groundY();

  if (winTimer < 3.5) {
    // BOARDING
    drawSky(); drawClouds();
    ctx.fillStyle = '#bdb6c8'; ctx.fillRect(0, gy, W, H - gy);
    ctx.strokeStyle = '#fff3b0'; ctx.lineWidth = 6; ctx.setLineDash([30, 24]);
    ctx.beginPath(); ctx.moveTo(0, gy + (H - gy) / 2); ctx.lineTo(W, gy + (H - gy) / 2); ctx.stroke(); ctx.setLineDash([]);
    const jx = W * 0.66, jy = gy - 80;
    drawJet(jx, jy, 1.15, 0);
    // airstairs
    ctx.fillStyle = '#cfc3e3';
    for (let i = 0; i < 6; i++) ctx.fillRect(jx - 170 - i * 15, gy - 8 - i * 15, 20, 15);
    // the family climbs the stairs and boards
    const board = Math.min(winTimer / 3.2, 1);
    const startX = W * 0.30, endX = jx - 150, startY = gy - 8, endY = gy - 96;
    const fam = [
      { s: 1.1, d: null,      c: false },
      { s: 1.0, d: '#ff9ecb', c: false },
      { s: 0.6, d: '#9bd8ff', c: false },
      { s: 1.0, d: '#ff7ac0', c: true  },   // Piggies the pig princess
    ];
    for (let i = 0; i < fam.length; i++) {
      const pr = Math.max(0, Math.min(1, board - i * 0.13));
      drawMiniPig(startX + (endX - startX) * pr, startY + (endY - startY) * pr, fam[i].s, fam[i].d, false, 0, fam[i].c);
    }
    // suited pig host in a red cap, waving at the bottom
    drawSuitPig(startX - 70, gy - 8, 1.0, true);

  } else if (winTimer < 6) {
    // TAKE OFF — rolls forward and noses up
    drawSky(); drawClouds();
    ctx.fillStyle = '#bdb6c8'; ctx.fillRect(0, gy, W, H - gy);
    ctx.strokeStyle = '#fff3b0'; ctx.lineWidth = 6; ctx.setLineDash([30, 24]);
    ctx.beginPath(); ctx.moveTo(0, gy + (H - gy) / 2); ctx.lineTo(W, gy + (H - gy) / 2); ctx.stroke(); ctx.setLineDash([]);
    const t = (winTimer - 3.5) / 2.5;
    const jx = W * 0.40 + t * W * 0.4, jy = gy - 80 - t * 70;
    drawJet(jx, jy, 1.15, -t * 0.22);
    if (Math.random() < 0.5) addEmoji(jx - 150, gy - 30, '💨', 28);

  } else {
    // FLY INTO THE CLOUDS — pastel sunset, drifting clouds, shrinking jet
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#ffd9a8'); g.addColorStop(0.5, '#ffc1e0'); g.addColorStop(1, '#cfe9ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff0a3';
    ctx.beginPath(); ctx.arc(W * 0.8, 110, 50, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 9; i++) {
      const cx = ((i * 250 + time * 30) % (W + 420)) - 210;
      drawCloud(cx, 120 + (i % 4) * 95, 1.0 + (i % 3) * 0.35);
    }
    const climb = Math.min((winTimer - 6) / 4, 1);
    const jx = W * 0.42 + climb * W * 0.42;
    const jy = gy - 80 - climb * (gy * 0.9);
    const s = 1.15 - climb * 0.75;
    drawJet(jx, jy, s, -0.25);
    if (Math.random() < 0.4) addEmoji(jx - 70, jy + 20, ['💕', '✨', '💗'][Math.floor(Math.random() * 3)]);
    ctx.font = '30px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('✈️💕', W / 2, 64 + Math.sin(time * 3) * 8); ctx.textAlign = 'left';
  }
}

// ----- LEVEL 1: hug → nails → fireworks -----
function drawWinLevel1() {
  const gy = groundY();
  if (winTimer < 3.5) {
    drawSky(); drawClouds(); drawGround();
    ctx.save(); ctx.translate(W / 2, gy);
    for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) {
      ctx.fillStyle = (r + c) % 2 ? '#ffb3d9' : '#ffffff';
      ctx.fillRect(-120 + c * 40, 6 + r * 12, 40, 12);
    }
    ctx.restore();
    const cx = W / 2, squeeze = Math.min(winTimer / 1.2, 1), bob = Math.sin(time * 5) * 4, lean = 0.12 * squeeze;
    drawMiniPig(cx - 150 + 60 * squeeze, gy - 8 + bob, 1.15, null,      false,  lean, false);
    drawMiniPig(cx + 150 - 60 * squeeze, gy - 8 - bob, 1.05, '#ff9ecb', false, -lean, false);
    drawMiniPig(cx - 55, gy - 4 + bob * 0.5, 0.65, '#9bd8ff', false,  lean, false);
    drawMiniPig(cx + 8,  gy - 6 - bob * 0.5, 0.9,  '#ffd97a', false, -lean * 0.5, false);
    const pulse = 1 + Math.sin(time * 6) * 0.15;
    ctx.font = (64 * pulse) + 'px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('💗', cx, gy - 200); ctx.textAlign = 'left';
  } else if (winTimer < 8) {
    drawNailCloseup(winTimer - 3.5);
  } else {
    drawFireworksFinale(['🐷', '💅', '✨']);
  }
}

function drawNailCloseup(t2) {
  const g = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, Math.max(W, H) * 0.7);
  g.addColorStop(0, '#ffe6f4'); g.addColorStop(1, '#e9d4ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.font = '54px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('💅', W / 2, 90); ctx.textAlign = 'left';
  const hx = W / 2, hy = H * 0.72;
  ctx.fillStyle = '#f2d8ff'; ctx.beginPath(); ctx.ellipse(hx, hy + 60, 230, 60, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fbbcd0'; ctx.beginPath(); ctx.ellipse(hx, hy + 30, 170, 95, 0, 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < 4; i++) {
    const fx = hx - 105 + i * 70;
    const fy = hy - 30 - Math.sin((i / 3) * Math.PI) * 22;
    ctx.fillStyle = '#fbbcd0'; ctx.beginPath(); ctx.ellipse(fx, fy + 28, 26, 42, 0, 0, Math.PI * 2); ctx.fill();
    const paintAt = 0.6 + i * 0.9, painted = t2 > paintAt;
    ctx.fillStyle = painted ? NAIL_COLORS[i] : '#fde9f1';
    ctx.beginPath(); ctx.ellipse(fx, fy, 17, 21, 0, 0, Math.PI * 2); ctx.fill();
    if (painted) {
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.ellipse(fx - 6, fy - 8, 4, 7, -0.4, 0, Math.PI * 2); ctx.fill();
      if (t2 - paintAt < 0.5) { addEmoji(fx + rand(-12, 12), fy - 20, '✨', 18); if (Math.random() < 0.2) playSound('polish'); }
    }
  }
  const target = Math.max(Math.min(Math.floor((t2 - 0.6) / 0.9) + 1, 3), 0);
  const bx = hx - 105 + target * 70 + Math.sin(time * 16) * 6;
  const by = hy - 30 - Math.sin((target / 3) * Math.PI) * 22 - 8;
  ctx.save(); ctx.translate(bx, by); ctx.rotate(-0.5 + Math.sin(time * 16) * 0.08);
  ctx.fillStyle = '#ff5fa8'; ctx.beginPath(); ctx.ellipse(0, 0, 6, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#b03a78'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, -64); ctx.stroke(); ctx.restore();
}

function drawFireworksFinale(emojiTop) {
  const gy = groundY();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#8a7bb8'); g.addColorStop(0.6, '#caa8d8'); g.addColorStop(1, '#ffd9ec');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 24; i++) {
    const sxr = (i * 137) % W, syr = (i * 73) % (H * 0.5);
    ctx.globalAlpha = 0.4 + Math.sin(time * 3 + i) * 0.35;
    ctx.fillStyle = '#fff8d6'; ctx.beginPath(); ctx.arc(sxr, syr, 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#b89ccf'; ctx.fillRect(0, gy, W, H - gy);
  const cx = W / 2, bob = Math.sin(time * 5) * 3;
  drawMiniPig(cx - 110, gy - 6 + bob, 1.15, null,      true, 0, false);
  drawMiniPig(cx - 40,  gy - 6 - bob, 1.05, '#ff9ecb', true, 0, false);
  drawMiniPig(cx + 25,  gy - 4 + bob, 0.9,  '#ffd97a', true, 0, level === 2);
  drawMiniPig(cx + 85,  gy - 2 - bob, 0.65, '#9bd8ff', true, 0, false);
  ctx.font = '30px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('🎉', cx, gy - 170 + Math.sin(time * 4) * 8); ctx.textAlign = 'left';
}

// ----- LEVEL 2: makeover → tea party → enter the castle -----
function drawWinLevel2() {
  const gy = groundY();

  if (winTimer < 3) {
    // ----- MAKEOVER: Piggies gets dolled up into a pig princess -----
    const g = ctx.createRadialGradient(W / 2, H * 0.55, 40, W / 2, H * 0.55, Math.max(W, H) * 0.7);
    g.addColorStop(0, '#fff0f8'); g.addColorStop(1, '#e9d4ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    const cx = W / 2, by = gy + 40;
    const transform = Math.min(winTimer / 2.2, 1);   // 0 = plain, 1 = full princess

    // swirling magic ring while transforming
    if (winTimer < 2.4) {
      for (let i = 0; i < 10; i++) {
        const a = time * 4 + i * (Math.PI * 2 / 10);
        const rr = 120 - transform * 40;
        ctx.fillStyle = ['#ffd166', '#ff8fc8', '#c5a3ff', '#9bd8ff'][i % 4];
        ctx.globalAlpha = 0.9;
        ctx.beginPath(); ctx.arc(cx + Math.cos(a) * rr, by - 90 + Math.sin(a) * rr * 0.5, 5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Piggies, growing a fancier gown + crown as she transforms
    ctx.save(); ctx.translate(cx, by); ctx.scale(2.4, 2.4);
    // gown: starts yellow, blends toward royal pink/purple
    const gownColor = transform > 0.5 ? '#ff7ac0' : '#ffd97a';
    // legs
    ctx.strokeStyle = '#f7a8bf'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-9, -26); ctx.lineTo(-9, -2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9, -26);  ctx.lineTo(9, -2);  ctx.stroke();
    // flowing gown (wider as it becomes royal)
    const hem = 26 + transform * 12;
    ctx.fillStyle = gownColor;
    ctx.beginPath(); ctx.moveTo(-7, -60); ctx.lineTo(7, -60); ctx.lineTo(hem, -22); ctx.lineTo(-hem, -22); ctx.closePath(); ctx.fill();
    if (transform > 0.5) {                            // sparkle sash
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(-14, -40, 28, 4);
    }
    // arms
    ctx.strokeStyle = '#f7a8bf'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(-12, -50); ctx.lineTo(-24, -42); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, -50);  ctx.lineTo(24, -42);  ctx.stroke();
    // head
    ctx.fillStyle = '#fbbcd0';
    ctx.beginPath(); ctx.arc(0, -80, 22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-12, -100, 6, 10, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7, -101, 6, 10, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f7a8bf'; ctx.beginPath(); ctx.ellipse(12, -77, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d97a9c';
    ctx.beginPath(); ctx.arc(9, -77, 2.2, 0, Math.PI * 2); ctx.arc(16, -77, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a2e3f';
    ctx.beginPath(); ctx.arc(-2, -84, 3, 0, Math.PI * 2); ctx.arc(7, -84, 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#d97a9c'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(3, -72, 6, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    // crown pops in near the end
    if (transform > 0.6) {
      const cs = Math.min((transform - 0.6) / 0.4, 1);
      ctx.save(); ctx.translate(0, -98); ctx.scale(cs, cs);
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.moveTo(-14, 2); ctx.lineTo(-14, -12); ctx.lineTo(-6, -3); ctx.lineTo(0, -16);
      ctx.lineTo(6, -3); ctx.lineTo(14, -12); ctx.lineTo(14, 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff5fa8'; ctx.beginPath(); ctx.arc(0, -8, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    ctx.font = '40px sans-serif'; ctx.textAlign = 'center';
    ctx.globalAlpha = 0.7 + Math.sin(time * 6) * 0.3;
    ctx.fillText('✨', cx - 120, by - 150); ctx.fillText('✨', cx + 120, by - 120);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';

  } else if (winTimer < 7.5) {
    // ----- TEA PARTY -----
    drawSky(); drawClouds(); drawGround();
    const cx = W / 2, tableY = gy - 30;

    // Princess-Piggies + family + surviving princesses around a tea table
    drawMiniPig(cx - 150, gy - 8, 1.0, '#ff9ecb', false, 0, false);   // Mama
    drawMiniPig(cx - 205, gy - 8, 1.1, null,      false, 0, false);   // Papa
    drawMiniPig(cx + 150, gy - 4, 0.6, '#9bd8ff', false, 0, false);   // Baby
    const surv = survivors();
    for (let i = 0; i < surv.length; i++) {
      drawPrincessAt(cx + 200 + i * 64, gy - 10, surv[i], false);
    }

    // The tea table
    ctx.fillStyle = '#d9a7e8'; ctx.fillRect(cx - 90, tableY, 180, 14);
    ctx.fillStyle = '#b685c9'; ctx.fillRect(cx - 80, tableY + 14, 10, 30); ctx.fillRect(cx + 70, tableY + 14, 10, 30);
    // lace tablecloth
    ctx.fillStyle = '#fff0f8'; ctx.fillRect(cx - 90, tableY, 180, 8);
    // teapot + cups + cupcake (emoji)
    ctx.font = '30px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('🫖', cx, tableY - 6);
    ctx.font = '22px sans-serif';
    ctx.fillText('☕', cx - 55, tableY - 2);
    ctx.fillText('☕', cx + 55, tableY - 2);
    ctx.fillText('🧁', cx - 22, tableY - 2);
    ctx.fillText('🍰', cx + 22, tableY - 2);
    ctx.textAlign = 'left';

    // Princess-Piggies (the star) sits at the head, crowned
    drawMiniPig(cx, gy - 6, 1.05, '#ff7ac0', false, 0, true);

    // steam wisps rising from the teapot
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const baseX = cx - 6 + i * 6;
      ctx.beginPath();
      for (let k = 0; k < 5; k++) {
        const yy = tableY - 30 - k * 12;
        const xx = baseX + Math.sin(time * 3 + k * 0.8 + i) * 6;
        if (k === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }

  } else {
    // ----- ENTER THE CASTLE (with fireworks) -----
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#8a7bb8'); g.addColorStop(0.6, '#caa8d8'); g.addColorStop(1, '#ffd9ec');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 24; i++) {
      const sxr = (i * 137) % W, syr = (i * 73) % (H * 0.5);
      ctx.globalAlpha = 0.4 + Math.sin(time * 3 + i) * 0.35;
      ctx.fillStyle = '#fff8d6'; ctx.beginPath(); ctx.arc(sxr, syr, 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#b89ccf'; ctx.fillRect(gy * 0, gy, W, H - gy);

    // A big castle, centered, with a glowing open doorway
    drawCastle(1.25, W / 2 - 200);
    const doorX = W / 2 - 200 + 180 * 1.25;
    const doorBase = gy;
    // glowing doorway
    const glow = ctx.createRadialGradient(doorX, doorBase - 30, 5, doorX, doorBase - 30, 70);
    glow.addColorStop(0, 'rgba(255,245,200,0.95)'); glow.addColorStop(1, 'rgba(255,245,200,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(doorX, doorBase - 30, 70, 0, Math.PI * 2); ctx.fill();

    // Princess-Piggies walks INTO the castle, shrinking as she enters
    const t3 = winTimer - 7.5;
    const enter = Math.min(t3 / 3, 1);
    const walkX = W / 2 - 120 + (doorX - (W / 2 - 120)) * enter;
    const scale = 1.1 * (1 - enter * 0.5);
    if (enter < 0.98) {
      drawMiniPig(walkX, gy - 6, scale, '#ff7ac0', false, 0, true);
    }
    // family waving goodbye-for-now from the left
    const cx = W / 2 - 260, bob = Math.sin(time * 5) * 3;
    drawMiniPig(cx - 60, gy - 6 + bob, 0.95, null,      true, 0, false);
    drawMiniPig(cx,      gy - 6 - bob, 0.9,  '#ff9ecb', true, 0, false);
    drawMiniPig(cx + 50, gy - 4 + bob, 0.55, '#9bd8ff', true, 0, false);

    ctx.font = '30px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('🏰', W / 2, 60 + Math.sin(time * 3) * 6);
    ctx.fillText('👑', doorX, doorBase - 150 + Math.sin(time * 4) * 8);
    ctx.textAlign = 'left';
  }
}

// ---------- Main draw ----------
function draw() {
  if (state === 'win') { drawWinCutscene(); return; }
  drawSky();
  drawClouds();
  if (level === 3) { drawCastle(); drawHall(); }
  else if (level === 4) {
    drawBeachBack();
    if (state === 'playing' && time < 3.5) { const t = time / 3.5; drawJet(W * 0.32 + t * W * 0.55, 120 - t * 60, 0.6 - t * 0.25, -0.2); }
  } else if (level === 5) { drawCityBack(); }
  else { drawCastle(); }
  drawGround();
  if (level === 5) drawStreetProps();
  if (level !== 3 && level !== 4 && level !== 5) drawFlowers();
  if (level !== 3 && level !== 4 && level !== 5) for (let tx = 1400; tx < worldLength; tx += 2500) drawIceCreamTruck(tx);
  if (level === 3) drawLevel3Finish();
  else if (level === 4) drawLevel4Finish();
  else if (level === 5) drawLevel5Finish();
  else drawPicnicAndSalon();
  if (level === 4) drawCoins();
  drawPickups();
  drawPrincesses();
  if (level === 5) drawNPCs();
  for (const w of wolves) if (w.alive) drawWolf(w);
  for (const m of motos) if (m.alive) drawMoto(m);
  for (const k of knights) if (k.alive) drawKnight(k);
  if (level === 4) drawBaby();
  drawPig();
  if (level === 5) { drawBricks(); drawHelicopter(); }
  drawParticles();
  drawScreenParticles();
  drawHUD();
}

// Polyfill roundRect for older browsers
if (!ctx.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    return this;
  };
}

// ---------- Game loop ----------
let last = performance.now();
let prevState = '';
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  // show/hide the touch jump button only while playing
  if (state !== prevState) {
    jumpBtn.style.display = (isTouch && state === 'playing') ? 'flex' : 'none';
    prevState = state;
  }
  requestAnimationFrame(loop);
}
resetGame();
requestAnimationFrame(loop);
</script>
